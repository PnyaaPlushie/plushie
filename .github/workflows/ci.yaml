name: ci
on: [push, pull_request]

env:
  PLUSHIE_FETCH_UNITY_TEST: "1"

jobs:
  windows-x64-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: lukka/get-cmake@latest

      - run: cmake --workflow --preset windows-x64-msvc

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-msvc
          archive: false
          path: dist/Windows/windows-x64-msvc/plushie-0.1.0-win64.zip