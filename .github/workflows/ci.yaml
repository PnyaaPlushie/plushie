name: ci
on: 
  schedule:
    - cron: '0 5 * * *'
      timezone: 'Europe/London'
  push:
  pull_request:
  
env:
  PLUSHIE_FETCH_UNITY_TEST: "1"

jobs:
  build:
    strategy:
      fail-fast: false 
      matrix:
        include:
          - { host-os: windows-latest,   target: windows-x64-msvc,      workflow-postfix: "build-package-test", dist-path: "dist/Windows/windows-x64-msvc/plushie-host-windows-*.zip"  }
          - { host-os: ubuntu-latest,    target: windows-x64-msvc-xwin, workflow-postfix: "build-package",      dist-path: "dist/Linux/windows-x64-msvc-xwin/plushie-host-linux-*.zip" }
          - { host-os: ubuntu-latest,    target: linux-x64-clang,       workflow-postfix: "build-package-test", dist-path: "dist/Linux/linux-x64-clang/plushie-host-linux-*.zip"       }
          - { host-os: ubuntu-24.04-arm, target: linux-arm64-clang,     workflow-postfix: "build-package-test", dist-path: "dist/Linux/linux-arm64-clang/plushie-host-linux-*.zip"     }
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.host-os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          host-os: ${{ matrix.host-os }}
          preset:  ${{ matrix.target }}

      - name: Workflow
        run: cmake --workflow --preset ${{ matrix.target }}-${{ matrix.workflow-postfix }}

      - name: Archive 
        if: matrix.dist-path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          archive: false
          path: ${{ matrix.dist-path }}

