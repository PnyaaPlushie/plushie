name: ci
on: [push, pull_request]

env:
  PLUSHIE_FETCH_UNITY_TEST: "1"

jobs:

  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.host-os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - { host-os: windows-latest, preset: windows-x64-msvc,       dist-path: "dist/Windows/windows-x64-msvc/plushie-host-windows-*.zip" }
          - { host-os: ubuntu-latest,  preset: windows-x64-msvc-cross, dist-path: ""                                                         }
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      

      - name: Setup
        uses: ./.github/actions/setup
        with:
          host-os: ${{ matrix.host-os }}
          preset : ${{ matrix.preset }}

      - name: Workflow
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Archive 
        if: matrix.dist-path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.preset }}
          archive: false
          path: ${{ matrix.dist-path }}

